step_type: default_step
name: Collect Booking Reference For Check In
conditions:
- name: Collected
  condition_type: step_condition
  description: Booking reference collected
  child_step: lookup_for_checkin
  required_entities:
  - booking_reference
extracted_entities:
- booking_reference
prompt: |-
  Zamoli pozivaoca za referentnu oznaku rezervacije (šestocifreni PNR kod) da bismo započeli prijavljivanje.
  Ako je pozivalac već pomenuo referentnu oznaku ranije, preuzmi je — ne pitaj ponovo.
