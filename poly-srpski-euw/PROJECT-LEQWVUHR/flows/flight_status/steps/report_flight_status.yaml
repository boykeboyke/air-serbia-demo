step_type: default_step
name: Report Flight Status
conditions:
- name: Done
  condition_type: step_condition
  description: Caller has received the flight status and confirmed they have no further questions about this flight
  child_step: flight_status_done
  required_entities: []
extracted_entities: []
prompt: |-
  Pročitaj pozivaocu sve relevantne podatke o letu koje si upravo dobio:
  - Let: {{vrbl:flight_code}}
  - Ruta: {{vrbl:flight_route}}
  - Status: {{vrbl:flight_status_result}}
  - Gejt/terminal: {{vrbl:flight_gate}}

  Ako let kasni, najpre iskaži razumevanje, pa onda daj ažurirane informacije.
  Zatim pitaj da li ima još nešto čime možeš da pomogneš.
  Sačekaj odgovor pozivaoca pre nego što zaključiš.
