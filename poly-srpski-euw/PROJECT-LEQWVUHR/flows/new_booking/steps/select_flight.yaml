step_type: default_step
name: Select Flight
conditions:
- name: Flight Selected
  condition_type: step_condition
  description: The caller selected one of the offered flights
  child_step: map_selected_flight
  required_entities:
  - selected_flight
- name: Declined All
  condition_type: step_condition
  description: The caller doesn't want any of the offered flights
  child_step: handle_no_selection
  required_entities: []
extracted_entities:
- selected_flight
prompt: |-
  Predstavi dostupne letove pozivaocu prirodno. Prikaži samo slotove koji imaju vrednost:
  1. {{vrbl:alt_slot_1}}
  2. {{vrbl:alt_slot_2}}
  3. {{vrbl:alt_slot_3}}

  Vremena u slotovima su polazak i dolazak. Uvek ih izgovori kao "polazak u devet sati, dolazak u deset sati i pet minuta".
  Nikada ih ne pretvaraj u trajanje leta. Kod leta čitaj kao slova plus cifre jednu po jednu.

  Ako ima više opcija, pitaj koji bi im odgovarao.
  Ako nijedan ne odgovara, obavesti ih.
