step_type: default_step
name: Booking Complete
conditions:
- name: Done
  condition_type: exit_flow_condition
  description: The caller acknowledges the booking and has no further questions
  required_entities: []
extracted_entities: []
prompt: |-
  Rezervacija je potvrđena! Reci pozivaocu:
  - Referentna oznaka rezervacije: {{vrbl:booking_reference}} (pročitaj slovo po slovo)
  - Ukupna cena: {{vrbl:booking_total}} evra
  - Potvrda će biti poslata na: {{vrbl:booking_email}}

  Zatim pitaj da li ima još nešto čime možeš da pomogneš danas.
