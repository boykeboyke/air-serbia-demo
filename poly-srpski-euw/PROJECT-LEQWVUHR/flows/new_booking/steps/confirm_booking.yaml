step_type: default_step
name: Confirm Booking
conditions:
- name: Confirmed
  condition_type: step_condition
  description: The caller confirmed all details and wants to proceed with booking
  child_step: execute_booking
  required_entities:
  - origin_city
  - destination_city
  - travel_date
  - num_passengers
  - passenger_full_name
  - passenger_email
  - passenger_dob
  - passenger_nationality
  - passenger_passport_number
  - passenger_passport_expiry
- name: Declined
  condition_type: step_condition
  description: The caller does not want to proceed or wants to start over
  child_step: Collect Booking Details
  required_entities: []
extracted_entities:
- travel_date
- num_passengers
- origin_city
- destination_city
- fare_preference
- passenger_full_name
- passenger_email
- passenger_dob
- passenger_nationality
- passenger_passport_number
- passenger_passport_expiry
prompt: |-
  Pročitaj kompletan rezime rezervacije radi finalne potvrde:

  Let:
  - Ruta: {{entity:origin_city}} → {{entity:destination_city}}
  - Datum: {{entity:travel_date}}
  - Let: {{vrbl:chosen_flight}}, klasa: {{entity:fare_preference}}
  - Putnici: {{entity:num_passengers}}
  - Ukupna cena: {{vrbl:chosen_price}} evra

  Podaci putnika:
  - Ime: {{entity:passenger_full_name}}
  - Email: {{entity:passenger_email}}
  - Datum rođenja: {{entity:passenger_dob}}
  - Nacionalnost: {{entity:passenger_nationality}}
  - Pasoš / LK: {{entity:passenger_passport_number}}, važi do {{entity:passenger_passport_expiry}}

  Pitaj pozivaoca da potvrdi sve detalje. NE govori da je rezervacija potvrđena — to je sledeći korak.
  Ako pozivalac ispravi bilo koji podatak, izvuci ažuriranu vrednost i ponovo pročitaj ceo rezime.
