step_type: default_step
name: Confirm Booking
conditions:
- name: Confirmed
  condition_type: step_condition
  description: The caller confirmed and wants to proceed with booking
  child_step: execute_booking
  required_entities:
  - origin_city
  - destination_city
  - travel_date
  - num_passengers
- name: Declined
  condition_type: step_condition
  description: The caller does not want to proceed or wants to start over
  child_step: Collect Booking Details
  required_entities: []
extracted_entities:
- travel_date
- num_passengers
- origin_city
- destination_city
- fare_preference
prompt: |-
  Pročitaj detalje rezervacije radi potvrde:
  - Ruta: {{entity:origin_city}} do {{entity:destination_city}}
  - Datum: {{entity:travel_date}}
  - Putnici: {{entity:num_passengers}}
  - Klasa: {{entity:fare_preference}}
  - Let: {{vrbl:chosen_flight}} po ceni od {{vrbl:chosen_price}} evra

  Pitaj pozivaoca da potvrdi: da li žele da nastave sa rezervacijom?
  NE govori da je rezervacija potvrđena — to je sledeći korak.
  Ako pozivalac ispravi neki podatak, izvuci ažuriranu vrednost i ponovo pročitaj rezime.
