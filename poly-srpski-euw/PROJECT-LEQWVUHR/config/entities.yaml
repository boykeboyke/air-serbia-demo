entities:
- name: flight_number
  description: Air Serbia flight number e.g. JU601
  entity_type: alphanumeric
  config:
    enabled: true
    validation_type: ''
    regular_expression: ^[A-Za-z]{2}[0-9]{1,4}$
- name: booking_reference
  description: 6-character PNR booking reference
  entity_type: alphanumeric
  config:
    enabled: true
    validation_type: ''
    regular_expression: ^[A-Za-z0-9]{6}$
- name: origin_city
  description: Departure city or airport
  entity_type: free_text
  config: {}
- name: destination_city
  description: Arrival city or airport
  entity_type: free_text
  config: {}
- name: travel_date
  description: Preferred travel date
  entity_type: date
  config:
    relative_date: false
- name: num_passengers
  description: Number of passengers
  entity_type: numeric
  config:
    has_decimal: false
    has_range: false
    min: 1
    max: 9
- name: fare_preference
  description: Fare class preference
  entity_type: enum
  config:
    options:
    - economy
    - business
- name: selected_flight
  description: Caller's flight selection from presented options
  entity_type: enum
  config:
    options:
    - slot_1
    - slot_2
    - slot_3
- name: etihad_guest_number
  description: Etihad Guest loyalty programme number
  entity_type: alphanumeric
  config:
    enabled: true
    validation_type: ''
    regular_expression: ^[A-Za-z0-9]+$
- name: member_surname
  description: Surname for loyalty member verification
  entity_type: name_config
  config: {}
- name: complaint_description
  description: Caller's complaint or feedback in their own words
  entity_type: free_text
  config: {}
- name: travel_period
  description: A date range or period the caller is interested in, e.g. "second half of July weekends", "last week of August"
  entity_type: free_text
  config: {}
- name: schedule_date
  description: A specific date the caller selects from a presented schedule
  entity_type: date
  config:
    relative_date: false
- name: passenger_full_name
  description: Full name of the passenger as it appears on their travel document
  entity_type: free_text
  config: {}
- name: passenger_email
  description: Email address for booking confirmation
  entity_type: free_text
  config: {}
- name: passenger_dob
  description: Passenger date of birth
  entity_type: date
  config:
    relative_date: false
- name: passenger_nationality
  description: Passenger nationality / country of citizenship
  entity_type: free_text
  config: {}
- name: passenger_passport_number
  description: Passport or national ID number
  entity_type: alphanumeric
  config:
    enabled: true
    validation_type: ''
    regular_expression: ^[A-Za-z0-9]{6,20}$
- name: passenger_passport_expiry
  description: Passport or national ID expiry date
  entity_type: date
  config:
    relative_date: false
- name: baggage_count
  description: Number of extra bags to add (1-5)
  entity_type: numeric
  config:
    has_decimal: false
    has_range: false
    min: 1
    max: 5
