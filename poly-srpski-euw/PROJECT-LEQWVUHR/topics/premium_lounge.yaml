name: Premium Lounge
enabled: true
actions: ''
content: |-
  Er Srbija Premium Lounge se nalazi u tranzitnoj zoni između gejta A4 i A5 u Terminalu 2 aerodroma Nikola Tesla u Beogradu.

  RADNO VREME: Svaki dan od 05:00 do 18:00.

  BESPLATAN PRISTUP:
  - Putnici Er Srbije u Biznis klasi koji putuju iz Beograda.
  - Putnici sa Ekonom Comfort tarifom koji putuju iz Beograda na Er Srbija letu.
  - Nosioci korporativnih članskih kartica Er Srbije.
  - Etihad Guest Gold i Platinum članovi na Er Srbija letovima.

  PLAĆEN PRISTUP:
  - Moguća kupovina ulaznice (passa) — unapred online ili na šalteru Lounuşa.
  - Cena zavisi od mesta kupovine i avio-kompanije kojom putujete.

  SADRŽAJ LOUNUŞA:
  - Besplatan Wi-Fi visokih brzina.
  - Prostrane kupatilne prostorije sa tušem.
  - Bogat izbor srpske i međunarodne hrane (topli i hladni bife).
  - Autentična srpska jela, domaća vina, rakija, pivo, žestoka pića, bezalkoholna pića.
  - Međunarodne i domaće novine i časopisi.

  LOUNOVI PO SVETU:
  - Er Srbija nudi pristup partnerskim lounovima na odabranim destinacijama — detalje proveriti na sajtu airserbia.com.
